<svg xmlns="http://www.w3.org/2000/svg" width="900" height="82" viewBox="0 0 900 82" role="img" aria-labelledby="title description">
  <title id="title">Contribution activity</title>
  <desc id="description">A blue neon terminal-style heading for the GitHub contribution snake animation.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b7ff"/>
      <stop offset=".5" stop-color="#163dff"/>
      <stop offset="1" stop-color="#65d9ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#00b7ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00b7ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#00b7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pulse { animation: pulse 3s ease-in-out infinite alternate; }
    .scan { animation: scan 5s linear infinite; }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes pulse { from { stroke-opacity: .4; } to { stroke-opacity: 1; } }
    @keyframes scan { from { transform: translateX(-900px); } to { transform: translateX(900px); } }
    @keyframes blink { to { opacity: 0; } }
  </style>
  <rect x=".75" y=".75" width="898.5" height="80.5" rx="10" fill="#0d1117" stroke="url(#border)" stroke-width="1.5" class="pulse"/>
  <path d="M1.5 11a10 10 0 0 1 10-10h877a10 10 0 0 1 10 10v22H1.5z" fill="#161b22"/>
  <circle cx="22" cy="17" r="5" fill="#00b7ff"/>
  <circle cx="40" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="17" r="5" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="12">ricardo@redteam: ~/contributions</text>
  <text x="24" y="62" font-family="JetBrains Mono,Consolas,monospace" font-size="15">
    <tspan fill="#00b7ff">└─$ </tspan><tspan fill="#e6e6e6">watch --live ./contribution-snake</tspan><tspan fill="#65d9ff" class="cursor">█</tspan>
  </text>
  <rect x="1" y="40" width="898" height="2" fill="url(#glow)" class="scan"/>
</svg>
