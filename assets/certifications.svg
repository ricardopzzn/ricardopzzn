    .item { text-decoration: underline; }
    @keyframes glow { from { stroke-opacity: .35; } to { stroke-opacity: .95; } }
    @keyframes scan { from { transform: translateY(-30px); } to { transform: translateY(1120px); } }
    @keyframes blink { to { opacity: 0; } }
  </style>
